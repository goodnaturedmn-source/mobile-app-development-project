<ion-header>
  <ion-toolbar color="dark">
    <ion-title>
      Movie App
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-searchbar
    [(ngModel)]="searchText"
    placeholder="Search movie..."
  ></ion-searchbar>

  <ion-button expand="block" (click)="searchMovies()">
    SEARCH
  </ion-button>

  <h1>Today's Trending Movies</h1>

  <ion-card *ngFor="let movie of movies">

    <img
      [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
    >

    <ion-card-header>
      <ion-card-title>
        {{ movie.title }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>
        Release Date:
        {{ movie.release_date }}
      </p>

      <p>
        Rating:
        {{ movie.vote_average }}
      </p>

      <p>
        {{ movie.overview }}
      </p>
    </ion-card-content>

  </ion-card>

</ion-content>
